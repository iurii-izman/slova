name: Release — Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.1.0, 0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Type check frontend
        working-directory: apps/ui
        run: npm run check

      - name: Build frontend
        working-directory: apps/ui
        run: npm run build

      - name: Validate Rust format
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Run clippy lints
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri application
        working-directory: src-tauri
        run: cargo tauri build

      - name: Locate artifacts
        shell: pwsh
        run: |
          Write-Host "=== Windows Artifacts ==="
          Get-ChildItem -Recurse -Path "target/release/bundle" | Where-Object { $_.Extension -in @(".exe", ".msi") } | ForEach-Object {
            Write-Host "Found: $($_.FullName) ($('{0:N0}' -f $_.Length) bytes)"
          }

      - name: Create GitHub release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          retention-days: 30
