[package]
name = "slova-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fast batch transcription desktop app for videos using Groq Whisper API"

[lib]
name = "slova_tauri"
path = "src/lib.rs"

[[bin]]
name = "slova-tauri"
path = "src/main.rs"

[features]
default = ["with_tauri"]
with_tauri = []

[dependencies]
# Core
tauri = { version = "^2.0", features = [] }
tauri-plugin-dialog = "^2.0"

# Serialization & types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime (already in Tauri but explicit)
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# HTTP client
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }

# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }
sqlx-sqlite = "0.7"

# Secrets & credentials
keyring = "2.2"
secrecy = { version = "0.8", features = ["serde"] }

# Filesystem & utilities
tempfile = "3.8"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Rate limiting & synchronization
parking_lot = "0.12"
dashmap = "5.5"

# Random for jitter
rand = "0.8"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi", "time"] }
tracing-appender = "0.2"
tracing-panic = "0.1"

# TODO: add specta/tauri-specta when versions align with tauri 2.10.x

[build-dependencies]
# tauri-build to generate context/asset manifest during build
tauri-build = { version = "^2.0", features = [] }
base64 = "0.21.0"
